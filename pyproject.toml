[project]
name = "ames-housing-academic-prototype"
version = "0.1.0"
description = "Pipeline riproducibile di regressione tabellare per Ames Housing"
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
